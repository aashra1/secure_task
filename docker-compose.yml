services:
  mongo:
    image: mongo:8.0
    container_name: securetask-mongo
    restart: unless-stopped
    volumes:
      - securetask-mongo-data:/data/db
    networks:
      - securetask-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securetask-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/securetask
      JWT_EXPIRY: 3600
      JWT_REFRESH_EXPIRY: 604800
      LOGIN_MAX_ATTEMPTS: 15
      LOGIN_RATE_WINDOW_MINUTES: 15
      TRUST_PROXY_HOPS: 1
      SALT_ROUNDS: 12
      MFA_ISSUER: SecureTask
      FRONTEND_URL: https://localhost:3001
      EMAIL_SKIP: true
      # Nginx terminates HTTPS; the backend uses HTTP inside Docker.
      HTTPS_CERT_PATH: ""
      HTTPS_KEY_PATH: ""
      # Google's official reCAPTCHA v2 checkbox test keys for localhost.
      CAPTCHA_SITE_KEY: 6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI
      CAPTCHA_SECRET_KEY: 6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe
    expose:
      - "3000"
    networks:
      - securetask-network
    volumes:
      - ./backend/logs:/app/logs
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: securetask-frontend
    restart: unless-stopped
    ports:
      - "3001:443"
    depends_on:
      - backend
    networks:
      - securetask-network
    volumes:
      - ./certs/localhost.pem:/etc/nginx/certs/localhost.pem:ro
      - ./certs/localhost-key.pem:/etc/nginx/certs/localhost-key.pem:ro

networks:
  securetask-network:
    driver: bridge

volumes:
  securetask-mongo-data:
